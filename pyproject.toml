[build-system]
# PEP 639 SPDX `license = "MIT"` form below requires setuptools >= 77.
# Older versions reject the string-typed license and silently mark the
# wheel as unlicensed when installed via `pip install -e .` directly.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "getsubtitle"
version = "0.9.6.2"
description = "Download and prepare subtitles for streaming and local media language learning workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "getsubtitle contributors" }
]
keywords = ["subtitles", "language-learning", "anime", "netflix", "crunchyroll", "srt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing",
]
# tomllib is built-in on 3.11+; tomli is the backport for 3.10.
dependencies = [
  'tomli>=2.0 ; python_version < "3.11"',
]

[project.optional-dependencies]
furigana = ["pykakasi>=2.3"]
# Korean Revised Romanization with G2P preprocessing. g2pk handles
# palatalization (같이→가치) and nasal assimilation (읽는→잉는); korean-romanizer
# produces the final Revised Romanization output. Without g2pk the output
# is still useful but skips the phonological corrections.
romanization-ko = ["korean-romanizer>=0.25", "g2pk>=0.9.4"]
# Chinese (Mandarin) pinyin. pypinyin handles per-character pinyin
# lookup, polyphones, and built-in tone sandhi. Three modes share one
# library: `zh:marks` (nǐ hǎo), `zh:numbers` (ni3 hao3), `zh:letters` (ni hao).
romanization-zh = ["pypinyin>=0.51"]
# Cantonese Jyutping. PyCantonese provides a lexicon-backed
# characters_to_jyutping() helper; without it, getsubtitle reports a
# friendly install hint instead of guessing pronunciations.
romanization-yue = ["pycantonese>=4.3"]
dev = ["pytest>=8", "build>=1", "twine>=5"]

[project.scripts]
getsubtitle = "getsubtitle:main"

[project.urls]
Homepage = "https://github.com/fpenguin/getsubtitle"
Repository = "https://github.com/fpenguin/getsubtitle"
Issues = "https://github.com/fpenguin/getsubtitle/issues"

[tool.setuptools]
py-modules = ["getsubtitle", "getsubtitle_core"]
