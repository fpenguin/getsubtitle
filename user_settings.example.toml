# getsubtitle — user_settings.toml
# ───────────────────────────────────────────────────────────────────────
#
# What this file does:
#   This is your personal settings file. Every time you run getsubtitle, it
#   reads this file first to figure out what defaults to use (which language
#   to download, where to save files, which MT engine to use, etc.).
#
#   You don't have to set every value — leave anything alone and you'll get
#   the built-in default. Only override what you actually want different.
#
# Where this file lives:
#   macOS / Linux:  ~/.config/getsubtitle/user_settings.toml
#   Windows:        %APPDATA%\getsubtitle\user_settings.toml
#
# To create yours:
#   getsubtitle config --init       # copies this template to the right place
#   getsubtitle config --open       # opens it in your default editor
#   getsubtitle config --show       # print the full effective config
#
# Override precedence (lowest → highest):
#   1. Built-in defaults
#   2. This file (user_settings.toml)
#   3. --config FILE.toml (per-workflow config you specify on the CLI)
#   4. CLI flags like --source, --output, --format, -l, ...
#
# Sections — same names as the pipeline TOML schema, listed in execution
# order: fetch → translate → modify → merge → output → experimental.
#
# DO NOT put API keys here. Keys live in macOS Keychain or in environment
# variables (JIMAKU_API_KEY, WYZIE_API_KEY, DEEPL_API_KEY, TMDB_API_KEY).
#
# ───────────────────────────────────────────────────────────────────────
# Quickstart recipes — pick the closest match and copy that block. The
# active values below are tuned for an English speaker learning Japanese.
#
# (1) English speaker learning Japanese (default below)
#       [fetch]
#       languages = "ja"
#       [merge]
#       languages = "ja,en"
#
# (2) English speaker learning Spanish or French
#       [fetch]
#       languages = "es"             # or "fr"
#       [merge]
#       languages = "es,en"          # or "fr,en"
#
# (3) English speaker learning Korean
#       [fetch]
#       languages = "ko"
#       [merge]
#       languages = "ko,en"
#
# (4) Multi-language immersion (download multiple, merge a subset per-run)
#       [fetch]
#       languages = "ja,en,es"
#       [merge]
#       languages = "ja,en"          # per-run -l overrides this
#
# (5) Raw .srt downloads, no learning helpers
#       [modify]
#       single_line = false
#       strip_cc_noise = false
#       furigana = "off"
#       [translate]
#       engine = ""                  # disable MT fallback
# ───────────────────────────────────────────────────────────────────────


# ─── [fetch] ─── what to download and how to find it ──────────────────
# Settings that apply when you ask getsubtitle to fetch subtitles, either
# via URL (getsubtitle URL or --fetch URL) or by walking a folder.

[fetch]

# Which language(s) to download by default. Comma-separated.
# Accepts ISO codes (ja, en, ko, es, fr, zh, de, it, pt, ru) OR full names
# (japanese, english, korean, spanish, french, chinese, ...).
# Override per-run with: getsubtitle URL -l ja,en
# Default: "ja"
languages = "ja"

# Which "rip" to prefer when the provider returns multiple matches.
# auto    — figure out from the URL host (Hulu URL prefers HULU rips,
#           max.com prefers HMAX/MAX, etc.). Best for most users.
# any     — disable preference; provider picks whatever's first.
# <name>  — pin to one source: netflix | crunchyroll | amazon | hulu |
#           hbo | disney | apple | paramount | peacock
# Default: "auto"
release_source = "auto"


# ─── [translate] ─── machine translation defaults ─────────────────────
# These apply both when MT runs as a fallback after fetch (--engine)
# and when you run the standalone translate subcommand.

[translate]

# Which MT engine to use. Choices:
#   ""          — disable MT entirely (download-only)
#   "argos"     — offline, free. Requires `pip install argostranslate`.
#                 Quality: gist-level (good enough for context, not perfect).
#   "ollama"    — offline LLM. Requires the Ollama desktop app running.
#                 Quality: best of the offline options.
#   "deepl"     — online. Requires DEEPL_API_KEY (500K chars/month free tier).
#                 Quality: best overall, but uses cloud quota.
# You can also pin an Ollama model with the colon form: "ollama:qwen3:8b".
# Default: "argos"
engine = "argos"

# Default Ollama model when no per-pair override below matches.
# Common picks:
#   qwen3:4b              CJK-strong, small, fast (~2.5GB). Good ja↔ko, ja↔en.
#   qwen3:8b              Same family, higher quality (~5GB). Slower.
#   aya-expanse:8b        Cohere multilingual (~5GB). Strong on 23 languages.
#   llama3.2:3b           Good for European pairs (en↔es, en↔fr).
#   translategemma:12b    Google translation-specialised. Best quality, largest.
# Install one before relying on it:  ollama pull qwen3:4b
# Default: "qwen3:4b"
model = "qwen3:4b"

# Per-target source language. Avoids wasteful pairs like en→ja when the
# ja source is already on disk. Two forms:
#   string: "auto" (default — pick the best available source per target)
#           or "ja" (force all targets to translate from Japanese)
#           or "ko:ja,es:en" (per-target as a comma-list)
#   dict:   { ko = "ja", es = "en" } (per-target as a TOML table)
# Default: "auto"
# (`mt_source_lang` accepted as a back-compat alias)
mt_source = "auto"

# Strip inline 漢字（かんじ） readings from ja source cues before sending
# them to the translator. Without this, translators see the readings as
# extra Japanese text and translate them as duplicates. Default: true.
strip_furigana_before_mt = true


[translate.ollama_models]

# Automatically pull missing Ollama models on first use. When false,
# getsubtitle errors with an actionable hint instead of running
# `ollama pull`. Useful on metered connections. Default: true.
auto_load = true

# Free the Ollama model from RAM/VRAM as soon as the MT pass finishes
# (sends keep_alive=0 to Ollama). Turn off if you run getsubtitle
# back-to-back and want the model warm between calls. Default: true.
auto_unload = true

# Optional per-language-pair Ollama model overrides. Keys are "src:tgt"
# (colon or dash). --model on the CLI still wins for one-off runs.
#
# CJK pairs benefit from stronger multilingual models:
# "en:ja" = "qwen3:4b"
# "ja:en" = "qwen3:4b"
# "ja:ko" = "qwen3:4b"
#
# European pairs can usually use smaller/faster models:
# "en:es" = "llama3.2:3b"
# "en:fr" = "llama3.2:3b"


# ─── [modify] ─── cleanup applied to downloaded subtitle files ─────────
# These run automatically after fetch (so the SRTs landing on disk are
# already cleaned), and again whenever you call `getsubtitle modify`.

[modify]

# Flatten multi-line cues into single-line cues. asbplayer renders them
# cleaner this way. mpv users may prefer multi-line — set to false then.
# Default: true.
single_line = true

# Strip Japanese broadcast-caption noise from .ja.srt files. Currently
# removes the ➡ continuation arrow used by ANIMAX/NHK and similar.
# Default: true.
strip_cc_noise = true

# Japanese reading helper. Tristate:
#   "off"       — don't generate furigana side files
#   "hiragana"  — 漢字（かんじ）  ← Japanese learners typically want this
#   "romaji"    — 漢字（kanji）  ← absolute beginners
# Default: "hiragana"
furigana = "hiragana"

# Which file formats to generate for furigana side files. One of:
#   "srt"    — broadly compatible, inline parenthetical readings.
#              Safest fallback. One file per episode.
#   "vtt"    — ruby <ruby><rt> markup. Renders true furigana in asbplayer
#              when Settings > Misc > Subtitles > Subtitle HTML = Render.
#   "ass"    — stacked-line ASS. Experimental; player support varies.
#   "all"    — generate all three (srt + ass + vtt) — useful when you
#              want different formats for different downstream uses.
# Comma-lists also work: "srt,vtt"
# Default: "srt"
# (`furigana_output_format` and `format` are accepted as back-compat aliases)
reading_format = "srt"


# ─── [merge] ─── stacking multiple language tracks into one file ───────
# Settings for `getsubtitle merge` (stacks 2+ language SRTs into one
# study file with both languages on each cue).

[merge]

# Default language order for merge output. First language is the timing
# master unless --master or [merge].priority overrides.
# Default: "ja,en" — target language on top, English (likely native) below.
# Common picks: "ja,en", "es,en", "fr,en", "ko,en", "ja,ko"
languages = "ja,en"

# How strict the time-overlap match between languages should be:
#   "auto"    — default-tolerant window; handles most timing drift
#   "strict"  — require near-exact overlap; cleaner stacks, more skipped cues
#   "loose"   — most permissive; best when timings drift across releases
# Default: "auto"
sync = "auto"

# Keep each language's original line breaks instead of flattening to one
# line per language. Default: false.
preserve_lines = false

# Master-language priority list. When merging cues from multiple
# languages, ONE language is the "timing master" — its cue boundaries
# define when each combined cue starts/ends; the others align to it via
# time-overlap matching. First match in this list wins (overrides the
# first-language-in-`-l` default).
#
# Example: prefer ja master when present (broadcast SRTs are well-timed),
# fall back to en (Netflix / Crunchyroll, also well-timed) otherwise:
#   priority = ["ja", "en", "es", "fr", "ko"]
# Default: [] (use first language in -l)
priority = []

# Inline 漢字（かんじ） readings onto the ja line in the merged output.
# Uses the mode from [modify].furigana. Turn off if you don't want
# readings in the stacked file. Default: true.
furigana = true


# ─── [output] ─── where files go and global format defaults ────────────

[output]

# Default output folder for downloaded subtitles.
# ~ is expanded to your home directory.
# Default: "~/Movies/Subtitles"
target = "~/Movies/Subtitles"

# Folder layout for output files:
#   "archive"  — Title/Season 01/files (organized by show + season)
#   "flat"     — all files in one folder, no per-season subdir
#   "plex"     — Plex-style; preserves Show/Season XX/ for in-place library use
# Default: "archive"
layout = "archive"

# Open the output folder in Finder/Explorer after each download.
# Default: false (most users prefer headless).
open_folder = false

# Overwrite existing files and skip threshold checks. Applies to translate,
# modify, and merge. Use only when you're sure you want to re-do work.
# Default: false.
force = false

# Show raw provider counts and language tags from each provider call.
# Useful when debugging why a subtitle wasn't found. Default: false.
debug_providers = false


# ─── [experimental] ─── opt-in providers and features ──────────────────

[experimental]

# Enable Spanish Subdivx provider as a fallback. Web-scraped — may break
# without notice. Default: false.
subdivx = false

# Enable Korean Addic7ed provider as a fallback. Web-scraped; may rate-limit
# on repeated calls. Default: false.
addic7ed = false
